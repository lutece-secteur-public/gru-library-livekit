# livekit properties file

#######################################################################################################
# LiveKit Server Configuration
livekit.server.apiKey=your-api-key
livekit.server.apiSecret=your-api-secret
livekit.server.url=http://localhost:7880

# Default token TTL in seconds (6 hours)
livekit.server.token.ttl=21600

# URL pattern for the LiveKit front-end ({room} and {token} are replaced at runtime)
livekit.server.meetingUrlPattern=https://meet.example.com/?room={room}&token={token}
